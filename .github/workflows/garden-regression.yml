name: Royal Garden regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python scoring and persistence tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript dashboard, animation and renderer tests
        run: |
          node tests/test_ui.cjs
          node tests/test_sound.cjs
          node tests/test_verdict_cutscene.cjs
          node tests/test_round_cutscenes.cjs
          node tests/test_city_timeline.cjs
          node tests/test_arena_static.cjs
          node tests/test_theme_copy.cjs
